[project]
name = "rail-edge-mlops"
version = "0.0.0"
description = "Closed-loop MLOps for rail obstacle detection: ROCm training, Jetson TensorRT deployment, replay-driven drift monitoring"
requires-python = "==3.12.*"
# Runtime deps land here as phases need them. torch/torchvision are deliberately absent:
# they are ROCm-index-specific and pinned in docker/torch-requirements.txt instead.
dependencies = [
    "mlflow==3.15.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rail_edge_mlops"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

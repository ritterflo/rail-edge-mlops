schema: '2.0'
stages:
  extract:
    cmd: mkdir -p data/interim/nuimages && tar xzf 
      data/raw/nuimages-v1.0-all-metadata.tgz -C data/interim/nuimages 
      v1.0-train/sample.json v1.0-train/sample_data.json 
      v1.0-train/object_ann.json v1.0-train/log.json v1.0-train/category.json 
      v1.0-val/sample.json v1.0-val/sample_data.json v1.0-val/object_ann.json 
      v1.0-val/log.json v1.0-val/category.json && tar xzf 
      data/raw/nuimages-v1.0-all-samples.tgz -C data/interim/nuimages samples
    deps:
    - path: data/raw/nuimages-v1.0-all-metadata.tgz

stages:
  # Extracts only what the converter reads. The metadata archive also carries
  # surface_ann.json (segmentation surfaces) and ego_pose.json, together ~775MB per
  # split that nothing downstream touches; the samples archive is images only.
  # v1.0-test is deliberately absent: its annotations are withheld (0 object_ann
  # records), so it is unusable for training or evaluation.
  extract:
    cmd: >-
      mkdir -p data/interim/nuimages &&
      tar xzf data/raw/nuimages-v1.0-all-metadata.tgz -C data/interim/nuimages
      v1.0-train/sample.json v1.0-train/sample_data.json v1.0-train/object_ann.json
      v1.0-train/log.json v1.0-train/category.json
      v1.0-val/sample.json v1.0-val/sample_data.json v1.0-val/object_ann.json
      v1.0-val/log.json v1.0-val/category.json &&
      tar xzf data/raw/nuimages-v1.0-all-samples.tgz -C data/interim/nuimages samples
    deps:
      - data/raw/nuimages-v1.0-all-metadata.tgz
      - data/raw/nuimages-v1.0-all-samples.tgz
    outs:
      # push:false -- ~16GB that is a `tar xzf` away from the raw archives. Cached
      # locally so DVC can detect drift, but never uploaded.
      - data/interim/nuimages:
          push: false

  # nuImages' own train/val boundary is random; ours is by location. Merging them
  # into one pool and re-splitting is what makes the held-out set a real
  # distribution shift rather than a reshuffle.
  convert:
    cmd: >-
      python3 -m rail_edge_mlops.data.convert
      --meta-dirs data/interim/nuimages/v1.0-train data/interim/nuimages/v1.0-val
      --out data/processed/nuimages_coco.json
      --sidecar data/processed/provenance.json
    deps:
      - data/interim/nuimages
      - src/rail_edge_mlops/data/convert.py
      - src/rail_edge_mlops/data/categories.py
    outs:
      - data/processed/nuimages_coco.json
      - data/processed/provenance.json

  split:
    cmd: >-
      python3 -m rail_edge_mlops.data.split
      --coco data/processed/nuimages_coco.json
      --provenance data/processed/provenance.json
      --params params.yaml
      --out-dir data/processed/splits
    deps:
      - data/processed/nuimages_coco.json
      - data/processed/provenance.json
      - src/rail_edge_mlops/data/split.py
    params:
      - split
    outs:
      - data/processed/splits

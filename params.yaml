# DVC tracks this file. Change a value and `dvc repro` reruns exactly the stages that
# depend on it -- the split policy is versioned data, not a flag someone remembered.
split:
  # An entire held-out location, so the test set is a real distribution shift.
  test_location: boston-seaport
  # Fraction of *logs* (not images) from the training locations reserved for validation.
  val_fraction: 0.2
  seed: 42
  # Keep only this many logs from the training locations, for fast iteration.
  # null = use everything. Sampling is by log, never by image, so the grouping
  # invariant survives. Recorded in the split manifest, so a subsampled run can
  # never be mistaken for a full one.
  subsample_logs: null

train:
  # Pinned by revision, not just name: PekingU/rtdetr_v2_r18vd is a live repo whose
  # weights can change. The checkpoint is the most consequential input to every model
  # trained here, so it is the last thing that should float.
  checkpoint: PekingU/rtdetr_v2_r18vd
  checkpoint_revision: 5650961749fa93567c0d46fc7f43ea4f9e914107

  # [HEIGHT, WIDTH] -- the order the image processor takes, not the order people say
  # resolutions out loud. Written the other way round this silently trains a portrait
  # squash of landscape images, which looks like the experiment failing.
  # 576x1024 is 16:9 exactly and 32-divisible, so 1600x900 scales uniformly at 0.640;
  # 640x640 scales 0.400 horizontally against 0.711 vertically.
  image_size: [576, 1024]

  epochs: 1
  batch_size: 8
  # Fine-tuning learning rates, an order of magnitude below from-scratch. Too high
  # here destroys the pretrained features in the first few hundred steps, before the
  # randomly-initialised head produces gradients worth following.
  lr: 1.0e-4
  # The head must move a lot; the backbone barely at all.
  backbone_lr_mult: 0.1
  weight_decay: 1.0e-4
  warmup_steps: 200
  grad_clip: 0.1

  seed: 42
  num_workers: 8
  # Cap steps for smoke runs. null = a full pass over the training split.
  max_steps: null
  # Score below which detections are discarded at evaluation time.
  score_threshold: 0.05
